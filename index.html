<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>˚₊· Verdant Loot ·₊˚</title>

<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
    <div class="titleBox">
        <h1>˚₊· Verdant Loot ·₊˚</h1>
        <p class="tagline">Fresh tech designed for a smoother, fresher, and smarter experience.</p>
    </div>

    <input type="text" id="search" placeholder="Search products...">

    <div class="shopping">
        <img src="images/greenshoppingcart.png" alt="Cart">
        <span class="quantity">0</span>
    </div>
</header>

<div class="list"></div>

</div>

<div class="card">

    <h1>Cart</h1>

    <div class="empty">Cart is empty</div>

    <ul class="listCard"></ul>

    <div class="checkOut">
        <div class="total">0</div>
        <div class="closeShopping">Close</div>
        <div class="clearCart">Clear</div>
        <div class="checkoutBtn">Checkout</div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
